<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#16181C">
  <title>Panes</title>
  <!-- Installable as its own window (docs/UI.md, Panes Web). -->
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="icon" href="icons/icon-192.png" type="image/png" sizes="192x192">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="vendor/xterm.css">
  <link rel="stylesheet" href="style.css">
  <!-- xterm.js is vendored (see vendor/README.md); these set window.Terminal and window.FitAddon. -->
  <script src="vendor/xterm.js"></script>
  <script src="vendor/addon-fit.js"></script>
  <script type="module" src="app.js"></script>
</head>
<body>
  <header id="bar">
    <div id="tabs" role="tablist" aria-label="Open tabs"></div>
    <button id="add" class="icon-button" title="Open an app" aria-label="Open an app">
      <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
    </button>
    <div class="spacer"></div>
    <button id="search" class="search-box" aria-keyshortcuts="Meta+K Control+K">
      <svg aria-hidden="true" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
      <span class="label">Open an app on any machine</span>
      <kbd id="searchKey">⌘K</kbd>
    </button>
    <button id="devicesButton" class="bar-button" aria-label="Tabs on your other devices" aria-expanded="false" aria-controls="devices">
      <svg aria-hidden="true" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="14" height="10" rx="2"/><rect x="17" y="8" width="5" height="10" rx="1.5"/><path d="M6 18h6"/></svg>
      <span class="label">Other devices</span>
    </button>
  </header>

  <main id="stage">
    <div id="empty">
      <h2>Nothing open</h2>
      <p>Press <span id="emptyKey">⌘K</span> to open an app on any of your machines.</p>
    </div>

    <section id="devices" class="popover" hidden aria-label="Other devices">
      <div id="devicesList"></div>
      <div id="sendSection"></div>
      <div class="divider"></div>
      <button id="settingsButton" class="menu-row">
        <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
        <span>This browser: <span id="myName"></span></span>
      </button>
    </section>

    <section id="settings" class="popover" hidden aria-labelledby="settingsTitle">
      <h3 id="settingsTitle">Settings</h3>
      <label class="field">
        <span>This device's name</span>
        <input id="deviceName" type="text" maxlength="60" autocomplete="off" spellcheck="false">
      </label>
      <label class="toggle-row"><span>Fit windows to this tab</span><input type="checkbox" id="fit" class="switch"></label>
      <label class="toggle-row"><span>Play the app's sound</span><input type="checkbox" id="audio" class="switch"></label>
      <div class="actions"><button id="settingsDone" class="link">Done</button></div>
    </section>
  </main>

  <div id="palette" class="palette-backdrop" hidden>
    <section class="palette" role="dialog" aria-modal="true" aria-label="Open an app on any machine">
      <div class="palette-head">
        <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
        <label for="query" class="visually-hidden">Search apps on every machine</label>
        <input id="query" type="text" placeholder="Search apps, windows and machines" autocomplete="off" spellcheck="false"
               role="combobox" aria-expanded="true" aria-controls="results" aria-autocomplete="list">
        <kbd>esc</kbd>
      </div>
      <div id="results" class="palette-body" role="listbox" aria-label="Apps"></div>
    </section>
  </div>

  <div id="toast" class="toast" hidden role="status"></div>
</body>
</html>
